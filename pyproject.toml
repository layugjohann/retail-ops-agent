[project]
name = "retail-ops-agent"
version = "0.1.0"
description = "Forward-deployed retail ops prototype for the fictional Client Cobalt Home"
readme = "README.md"
authors = [
    { name = "layugjohann", email = "layugjohann@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "mcp>=2.3.0",
    "pandas>=3.1.1",
    "pydantic-ai-slim[google,groq]>=2.70.0",
    "streamlit>=1.67.0",
]

[project.scripts]
retail-ops-erp = "retail_ops_agent.erp_server:main"
retail-ops-trigger = "retail_ops_agent.trigger:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pandas-stubs>=3.1.0.261029",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests", "dashboard"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -n auto"
