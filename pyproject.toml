[project]
name = "retail-ops-agent"
version = "0.1.0"
description = "Forward-deployed retail ops prototype for the fictional Client Cobalt Home"
readme = "README.md"
authors = [
    { name = "layugjohann", email = "layugjohann@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "mcp>=2.3.0",
    "pandas>=3.1.1",
    "pydantic-ai-slim[google,groq]>=2.70.0",
    "streamlit>=1.67.0",
]

[project.scripts]
retail-ops-erp = "retail_ops_agent.erp_server:main"
retail-ops-trigger = "retail_ops_agent.trigger:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pandas-stubs>=3.1.0.261029",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.5",
    "vulture>=2.16",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "TID"]

[tool.ruff.lint.per-file-ignores]
# The clock seam is the one place allowed to read the real time.
"src/retail_ops_agent/clock.py" = ["TID251"]
# The eval command sits outside the Ops Day boundary and stamps each Scorecard with the real time; its
# `now` default is the injected clock's wall-clock source.
"src/retail_ops_agent/evals/runner.py" = ["TID251"]
# Vulture's whitelist is bare attribute accesses on an undefined `_` by design.
"vulture_whitelist.py" = ["B018", "F821"]

# Each message names the coding standard or ADR the ban comes from. tests/ruff.toml repeats this table
# without the ERP server ban, since the tests may reach the server directly.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "Times come from the injected clock (CODING_STANDARDS: Structure); use Clock.now()."
"datetime.date.today".msg = "Times come from the injected clock (CODING_STANDARDS: Structure); use Clock.now()."
"time.time".msg = "Times come from the injected clock (CODING_STANDARDS: Structure); use Clock.now()."
"langgraph".msg = "Agents are built with Pydantic AI, not LangGraph (ADR 0004)."
"retail_ops_agent.erp_server".msg = "Reach the ERP only through the ERP client interface in erp.py (ADR 0006)."

[tool.pyright]
include = ["src", "tests", "dashboard"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -n auto"

# Dead code, run by `make deadcode`. Names that frameworks use by convention are ignored here;
# vulture_whitelist.py lists the remaining false positives one by one.
[tool.vulture]
paths = ["src", "tests", "dashboard", "vulture_whitelist.py"]
ignore_names = ["model_config"]
ignore_decorators = ["@*.tool", "@model_validator", "@field_validator", "@pytest.fixture"]
